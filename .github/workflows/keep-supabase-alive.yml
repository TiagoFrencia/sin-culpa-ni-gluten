name: Keep Supabase Alive

on:
  schedule:
    # Corre automáticamente cada 4 días a las 12:00 UTC para prevenir la pausa por inactividad
    - cron: '0 12 */4 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          curl -fsS -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/business_settings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
