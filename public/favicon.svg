<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo circular chocolate espresso oscuro -->
  <circle cx="32" cy="32" r="30" fill="#1D120D" stroke="#F4EFE6" stroke-width="1.5" stroke-opacity="0.35" />
  <!-- Plato gastronómico con borde terracota -->
  <circle cx="32" cy="32" r="21" fill="#1D120D" stroke="#A64B2A" stroke-width="2.5" />
  <!-- Anillo interior sutil de vajilla artesanal -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#F4EFE6" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="2 1.5" />
  <!-- Monograma tipográfico SC en crema artesanal -->
  <text x="32" y="38" text-anchor="middle" fill="#F4EFE6" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" font-style="italic" letter-spacing="-0.5">SC</text>
  <!-- Detalle sutil artesanal terracota -->
  <circle cx="43" cy="24" r="1.8" fill="#A64B2A" />
</svg>
